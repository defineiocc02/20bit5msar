<text x="1838" y="562" font-size="14" font-weight="normal" fill="#4b6d58">input_valid, slot, version, fault, status</text>
<text x="85" y="920" font-size="16" font-weight="normal" fill="#5a7282">图只画 RX on 的主要已连路径；OFF 时两个 Record switch 实际分别选择 Adc.Raw / Adc.Ready。</text>
<text x="85" y="947" font-size="15" font-weight="normal" fill="#5a7282">BankOwner 与 Fpga 是 EventStep 内同级；状态64由 UnitDelay 提交，两个 h 槽是 P 中预加载的不可变参数，不存入该64字。</text>
<rect x="48" y="1035" width="2104" height="158" rx="10" fill="#fff3df" stroke="#e4c798" stroke-width="1.6"/>
<text x="70" y="1068" font-size="19" font-weight="700" fill="#77501e">配置以 rx_bank_on/parameters.mat 为准：N8、first_id=4、epoch1、RX on、Bank on、Train/Frozen off、τDAC18全0 / DAC耦合 off。</text>
<text x="70" y="1100" font-size="17" font-weight="normal" fill="#77501e">该案：Fs=5 MS/s，fin=90.33203125 kHz；失配 / DEM / dither on，AZ / kTC / jitter off；A/B 两槽同一 h、版本1/2。</text>
<text x="70" y="1132" font-size="17" font-weight="700" fill="#9a4d22">注意：SarPP 保存的 EventStep 静态文字仍写 transport=false、DEM/dither off，与该案 P 不符；本导览不使用该陈旧文字。</text>
<text x="70" y="1164" font-size="16" font-weight="normal" fill="#77501e">各案 (transport, bank, frozen)：factory_base/off=(0,0,0)；rx_nominal=(1,0,0)；rx_old_frozen=(1,0,1)；rx_bank_on=(1,1,0)。</text>
<rect x="48" y="1214" width="2104" height="152" rx="10" fill="#edf7f1" stroke="#b4d4bd" stroke-width="1.6"/>
<text x="70" y="1246" font-size="20" font-weight="700" fill="#275c3b">已保存的实际事件示例（该案，非理想点）</text>
<text x="70" y="1278" font-size="17" font-weight="normal" fill="#275c3b">hit147 / 0.600 µs：预定 PUBLISH slot2/version2、activation ID4；RecordReady=0，BankOwner meta 的 command_status=1。</text>
<text x="70" y="1308" font-size="17" font-weight="normal" fill="#275c3b">ID4 的 RX ready=1.338 µs：Raw6=[1878,3291,213,4,1,1]；Code20=957226，CodeValid=1，slot/version=2/2。</text>
<text x="70" y="1338" font-size="16" font-weight="normal" fill="#275c3b">Meta9=[342, 1.338e−6 s, 4, 1, 1, 2, 2, 0, 0]；根口同 ready 事件的对应关系由原生回执核对。</text>
<rect x="48" y="1388" width="2104" height="158" rx="10" fill="#fff" stroke="#c8d5de" stroke-width="1.6"/>
<text x="70" y="1420" font-size="20" font-weight="700" fill="#173044">证据边界</text>
<text x="70" y="1452" font-size="17" font-weight="normal" fill="#173044">12个实际 RX ready 包含 ID0–3 预热与 ID4–11 目标；两槽同 h 只证明版本路由，不是两次独立训练。</text>
<text x="70" y="1484" font-size="17" font-weight="normal" fill="#173044">NoDrainAck 是实际零常数，不表示已有消费端 drain；未验证后台 Train、动态装载、fault 注入、退休/槽复用或下游时钟合同。</text>
<text x="70" y="1516" font-size="16" font-weight="normal" fill="#536c7b">Bank off 时 y2 保留 Fpga 码，根 CodeValid=0 是该禁用输出合同，不应误读为 ADC 无效；结果不是产品/硅签核。</text>
</g></svg>