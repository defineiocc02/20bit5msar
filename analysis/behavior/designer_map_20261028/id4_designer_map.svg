<text x="70" y="1348" font-size="17" font-weight="normal" fill="#674b35">ADC RawReady 与 record-ready 同为 0.88625 µs；本次无 RX 传输。RaPreLog、逐比较器独立位和完整提交状态未完整保存。</text>
<text x="70" y="1379" font-size="17" font-weight="normal" fill="#674b35">源：112407 保存 P / 9 路 timeseries 与独立逐事件报告；四次预热不证明一般稳态，行为模型不等于硅片/PDK 测量。</text>
